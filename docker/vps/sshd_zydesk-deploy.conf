# Usuario de despliegue de Zydesk (ADR 0020; Fase 9 §5.4). Se instala como
# /etc/ssh/sshd_config.d/60-zydesk-deploy.conf (instalar-vps.sh). Doble cierre junto con la restricción de la llave
# en authorized_keys (`restrict,command="…"`). La desactivación global de contraseñas va aparte, en
# 05-sin-contrasena.conf, para ordenar antes que 50-cloud-init.conf (sshd toma el primer valor).
Match User zydesk-deploy
    PasswordAuthentication no
    PubkeyAuthentication yes
    AllowTcpForwarding no
    X11Forwarding no
    AllowAgentForwarding no
    PermitTTY no
    ForceCommand /srv/apps/zydesk/desplegar.sh
