# Zydesk detrás de nginx-proxy (ADR 0020; spec fase 9 §19 B1). Se instala como
# /srv/nexus-infra/proxy/conf.d/zydesk.conf; recarga:
#   docker exec nginx-proxy nginx -t && docker exec nginx-proxy nginx -s reload
# y luego commit en el repo nexus-infra. Misma convención que portfolio.conf. Cadena: cloudflared -> nginx-proxy:80 ->
# zydesk-web:8080 -> zydesk-api:3000. `zydesk-web` escucha en 8080 (nginx sin privilegios).
server {
    listen 80;
    server_name desk.zytech.dev;

    # 20 MB por archivo + multipart (ADR 0009); nginx-proxy rige 1 MB por defecto
    client_max_body_size 25m;

    # Resolución diferida (variable): nginx-proxy arranca aunque zydesk-web aún no exista
    resolver 127.0.0.11 valid=10s;
    set $up_zydesk zydesk-web:8080;

    location / {
        proxy_pass http://$up_zydesk;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # El túnel llega por HTTP: $scheme reescribiría https como http. Se reenvía el valor que fijó Cloudflare.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_request_buffering off;
    }
}
