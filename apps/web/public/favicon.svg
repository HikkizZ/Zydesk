  <path d="M100 60 L104 52" fill="none" stroke="#1D4ED8" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="109" cy="59" r="2.2" fill="#1D4ED8"/>

  <!-- Z body (beveled) -->
