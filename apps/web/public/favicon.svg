<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 108" width="132" height="108">
  <defs>
    <linearGradient id="zg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0B2A6F"/>
      <stop offset="0.55" stop-color="#1D4ED8"/>
      <stop offset="1" stop-color="#2F7DF6"/>
