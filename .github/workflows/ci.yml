# Integración continua (ADR 0020). Repositorio público: sin secretos, sin pull_request_target,
# permisos mínimos y acciones fijadas por SHA de commit (el tag va como comentario).
name: CI

on:
  push:
    # Solo ramas: subir una etiqueta no repite el CI del mismo commit (desplegar.yml usa el run de la rama).
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zydesk
          POSTGRES_PASSWORD: zydesk
          POSTGRES_DB: zydesk
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U zydesk -d zydesk"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar .env de CI (valores de prueba, sin secretos)
        run: |
          cp .env.example .env
          echo 'SEMILLA_PASSWORD=Semilla.CI.Prueba.1' >> .env
          echo 'ADMIN_PASSWORD=Admin.CI.Prueba.1' >> .env
          echo 'UF_ACTUALIZAR=false' >> .env

      - name: Crear roles y bases (mismo 01-roles.sql que el desarrollo local)
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update && sudo apt-get install -y postgresql-client
          fi
          PGPASSWORD=zydesk psql -v ON_ERROR_STOP=1 -h localhost -p 5433 -U zydesk -d zydesk -f docker/postgres-init/01-roles.sql

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formato
        run: npm run format:check

      - name: Tests
        run: npm test

      - name: Scripts de versión
        run: npm run test:scripts

      - name: Build
        run: npm run build

      # Imágenes de producción (§9.3): se construyen y se prueban, no se publican (sin login).
      # docker/probar-imagenes.sh usa `docker build`, que con buildx instalado usa su caché local.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Imágenes
        run: bash docker/probar-imagenes.sh

      - name: Scripts del VPS (shellcheck)
        run: |
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update && sudo apt-get install -y shellcheck
          fi
          find docker -name '*.sh' -print0 | xargs -0 shellcheck

      # F9-T5: desplegar.test.sh lo agrega el bloque 9C; el paso se salta mientras no exista.
      - name: Scripts del VPS (desplegar.test.sh)
        run: |
          if [ -f docker/vps/desplegar.test.sh ]; then
            bash docker/vps/desplegar.test.sh
          else
            echo "docker/vps/desplegar.test.sh aún no existe (F9-T5)"
          fi

      # ADR 0031: la API de larga vida no lleva zydesk_owner ni ADMIN_PASSWORD (solo zydesk-herramientas)
      - name: Compose de producción (compose.test.sh)
        run: bash docker/vps/compose.test.sh

      # Spec fase 9 §5.2 y §9.3: 01-roles.sh contra un postgres:16-alpine efímero (docker run, sin el service del job)
      - name: Roles de producción (01-roles.sh)
        run: bash docker/postgres-init-prod/probar-roles.sh

      - name: Navegador para Playwright
        run: npx playwright install --with-deps chromium

      - name: Semillas para las pruebas móviles
        run: npm run db:migrar && npm run db:sembrar

      - name: Pruebas móviles (Playwright)
        run: npm run test:movil

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: informe-playwright
          path: apps/web/e2e/informe
          retention-days: 7

      - name: OpenAPI sin cambios
        run: |
          npm run api:openapi
          git diff --exit-code docs/api/openapi.json
